<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#080c15;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1.2" fill="#334155" opacity="0.6"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-360px); }
        100% { transform: translateY(360px); }
      }
      .anim-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .anim-float1 { animation: floatSlow 5s ease-in-out infinite; }
      .anim-float2 { animation: floatAlt 6s ease-in-out infinite; }
      .beam-line { stroke-dasharray: 80 320; animation: beamMove 8s linear infinite; }
      .beam-line-rev { stroke-dasharray: 60 300; animation: beamMove 7s linear infinite reverse; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#cyberGrid)"/>

  <!-- Glowing Ambiance in Background -->
  <circle cx="240" cy="140" r="280" fill="url(#glowCyan)" class="anim-pulse"/>
  <circle cx="980" cy="220" r="300" fill="url(#glowPurple)" class="anim-pulse"/>

  <!-- Animated Circuit & Data Flow Lines (Background Layer) -->
  <g opacity="0.45">
    <!-- Horizontal bus lines -->
    <path d="M 0,80 L 320,80 L 380,130 L 780,130 L 840,80 L 1200,80" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 0,80 L 320,80 L 380,130 L 780,130 L 840,80 L 1200,80" fill="none" stroke="#00f5d4" stroke-width="2.5" class="beam-line" filter="url(#neonGlow)"/>

    <path d="M 0,280 L 260,280 L 320,230 L 860,230 L 920,280 L 1200,280" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 0,280 L 260,280 L 320,230 L 860,230 L 920,280 L 1200,280" fill="none" stroke="#8b5cf6" stroke-width="2.5" class="beam-line-rev" filter="url(#neonGlow)"/>

    <!-- Additional geometric accent circuits -->
    <path d="M 120,20 L 120,60 L 160,80" fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M 1040,340 L 1040,300 L 1000,280" fill="none" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Subtle Dynamic Tech Badges / Pills (Placed on perimeter to never occlude center text) -->
  <g class="anim-float1">
    <!-- Top Left Pill -->
    <g transform="translate(60, 42)">
      <rect width="142" height="32" rx="16" fill="url(#pillGrad)" stroke="#00f5d4" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" fill="#00f5d4" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="21" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">DYNAMIC SECRETS</text>
    </g>

    <!-- Top Right Pill -->
    <g transform="translate(980, 42)">
      <rect width="156" height="32" rx="16" fill="url(#pillGrad)" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" fill="#60a5fa" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="21" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">ZERO TRUST &amp; PAM</text>
    </g>
  </g>

  <g class="anim-float2">
    <!-- Bottom Left Pill -->
    <g transform="translate(70, 290)">
      <rect width="138" height="32" rx="16" fill="url(#pillGrad)" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" fill="#8b5cf6" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="21" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">E2EE KEY VAULT</text>
    </g>

    <!-- Bottom Right Pill -->
    <g transform="translate(990, 290)">
      <rect width="145" height="32" rx="16" fill="url(#pillGrad)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" fill="#10b981" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="21" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">GITOPS SECRETS</text>
    </g>
  </g>

  <!-- Central Foreground Elements (High Contrast & Clear Hierarchy) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Shield / Vault Lock Icon Foreground Icon -->
    <g transform="translate(0, -25)">
      <!-- Pulsing Outer Hexagon -->
      <polygon points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18" fill="#0f172a" stroke="url(#lockGrad)" stroke-width="2.5" filter="url(#neonGlow)">
        <animate attributeName="stroke-width" values="2;3.2;2" dur="3s" repeatCount="indefinite"/>
      </polygon>
      <!-- Keyhole / Padlock Symbol -->
      <path d="M -10,0 L 10,0 C 12,0 13,1 13,3 L 13,15 C 13,17 12,18 10,18 L -10,18 C -12,18 -13,17 -13,15 L -13,3 C -13,1 -12,0 -10,0 Z" fill="#00f5d4"/>
      <path d="M -7,0 L -7,-7 C -7,-11 -4,-14 0,-14 C 4,-14 7,-11 7,-7 L 7,0" fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="7" r="2.2" fill="#090d16"/>
      <path d="M 0,9.2 L 0,13" stroke="#090d16" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Foreground Main Title -->
    <text y="58" fill="url(#titleGrad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.9))">Awesome Secrets Management</text>

    <!-- Foreground Tagline / Subtitle -->
    <text y="92" fill="#94a3b8" font-size="17" font-weight="500" letter-spacing="0.2">Curated Directory of Enterprise SaaS &amp; Open-Source Tools for DevSecOps, PAM &amp; Zero Trust</text>

    <!-- Category Highlights Pills Bar -->
    <g transform="translate(0, 126)">
      <rect x="-310" y="-14" width="620" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text y="4" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="0.8">
        🔐 HASHICORP VAULT &amp; OPENBAO  •  🛡️ INFISICAL  •  🔑 CYBERARK  •  ⚡ KUBERNETES SECRETS  •  🔒 SOPS
      </text>
    </g>
  </g>

  <!-- Modern Accent Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="20" y1="2" x2="160" y2="2" stroke="#00f5d4" stroke-width="2.5" filter="url(#neonGlow)"/>
  <line x1="1040" y1="358" x2="1180" y2="358" stroke="#8b5cf6" stroke-width="2.5" filter="url(#neonGlow)"/>
</svg>
